<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
    .container{
        height: 600px;
        
    }
    .header{
        height: 20%;
        border: 1px solid black;
        background-color: rgb(204, 144, 144);
    }
    .center{
        display: flex;
        height: 60%;
        border: 1px solid black;
    }
    .footer{
        height: 20%;
        border: 1px solid black;
        background-color: rgb(136, 226, 159);
    }
    .right{
        width: 80%;
        border: 1px solid black;
        background-color: rgb(87, 204, 224)
    }
    .left{
        width: 20%;
        border: 1px solid black;
        background-color: rgb(141, 154, 211);
    }
    .top{
        height: 50%;
        border: 1px solid black;
        background-color: rgb(243, 199, 239);
    }
    .bottom{
        display: flex;
        height: 50%;
        border: 1px solid black;

    }
    .leftbox{
        width: 50%;
        border: 1px solid black;
        background-color: skyblue
    }
    .rightbox{
        width: 50%;
        border: 1px solid black;
        background-color: rgb(238, 252, 202);
    }
    *{
        margin: 0;
        padding: 0;
    }
   </style>
</head>
<body>
  <div class="container">
    <div class="header"></div>
    <div class="center">
        <div class="left"></div>
        <div class="right">
            <div class="top"></div>
            <div class="bottom">
                <div class="leftbox"></div>
                <div class="rightbox"></div>
            </div>
        </div>
    </div>
    <div class="footer"></div>
  </div>
</body>
</html>
